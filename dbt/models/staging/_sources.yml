version: 2

sources:
  - name: raw_fred
    description: >
      Landed FRED/ALFRED data, as raw as the API returns it — no casting, no cleaning.
      On the snowflake target this is the RAW schema populated directly by
      ingest/pipeline_snowflake.py. On the duckdb target (no cloud account needed) it's the
      same schema/table names populated by `dbt seed` from dbt/seeds/raw_*.csv, generated by
      scripts/generate_dbt_seeds.py — same source() reference, same staging models, either way.
    schema: raw
    loaded_at_field: fetched_at
    freshness:
      warn_after: { count: 26, period: hour }
      error_after: { count: 72, period: hour }

    tables:
      - name: series_metadata
        description: One row per FRED series — title, frequency, units, seasonal adjustment, and its observation date range as FRED reports them.
        columns:
          - name: series_id
            description: FRED's own series identifier, e.g. DGS10. Natural key.
          - name: title
            description: Series title as published by FRED.
          - name: frequency
            description: FRED's short frequency code (D daily, M monthly, Q quarterly, ...).
          - name: units
            description: Units of the published value, as FRED describes them.
          - name: seasonal_adjustment
            description: FRED's seasonal adjustment short code (SA seasonally adjusted, NSA not).
          - name: observation_start
            description: Earliest observation date FRED has ever published for this series. Raw string — not yet cast to a date.
          - name: observation_end
            description: Most recent observation date FRED had published as of the last pull. Raw string — not yet cast to a date.
          - name: fetched_at
            description: When this row was landed (by the ingest pipeline, or generated into the seed fixture).

      - name: observations
        description: >
          Vintage-aware FRED/ALFRED observations. Grain: one row per (series_id, obs_date,
          realtime_start) — see DECISIONS.md's Phase 2 entry for why realtime_start, not
          obs_date alone, is the versioning key, and for which series get full ALFRED
          revision history versus current-vintage-only (the vintage_tracked flag in
          ingest/series.py).
        columns:
          - name: series_id
            description: FRED's own series identifier.
          - name: obs_date
            description: The economic observation date. Raw string — not yet cast to a date.
          - name: value
            description: The observed value exactly as FRED returned it, including the "." missing-value marker.
          - name: realtime_start
            description: First date this specific vintage of the value was known to be current. Raw string — not yet cast to a date.
          - name: realtime_end
            description: Last date this vintage was current before a later revision superseded it, or 9999-12-31 if it's still the current value. Raw string — not yet cast to a date.
          - name: fetched_at
            description: When this row was landed (by the ingest pipeline, or generated into the seed fixture).
