name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # A real Postgres so the integration test runs (not just skips) in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: change_me

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest -q

      - name: dbt deps (for sqlfluff's dbt templater)
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Lint (sqlfluff)
        # dbt/.sqlfluff pins target: duckdb, so this needs no Snowflake credentials — it
        # only compiles Jinja to check SQL style, doesn't touch real data.
        run: |
          cd dbt
          sqlfluff lint models/ tests/

  dbt-build:
    # Builds staging + marts into an isolated, per-run Snowflake schema, reading real data
    # from the production RAW schema (populated separately by ingest/pipeline_snowflake.py —
    # this job never ingests). Torn down afterward regardless of outcome. Runs after
    # lint-and-test passes, not in parallel — no reason to spend Snowflake credits on a
    # build that's already known-broken by a lint or unit-test failure.
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_SCHEMA: CI_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: dbt build (isolated schema, target=snowflake)
        run: dbt build --project-dir dbt --profiles-dir dbt --target snowflake

      - name: dbt source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt --target snowflake
        continue-on-error: true # freshness is informational here — see DECISIONS.md's warn_after/error_after config

      - name: Tear down CI schema
        if: always() # cleanup must run even if the build/tests above failed
        run: >
          dbt run-operation drop_ci_schema
          --args "{schema_name: ${{ env.SNOWFLAKE_SCHEMA }}}"
          --project-dir dbt --profiles-dir dbt --target snowflake

  publish-docs:
    # dbt docs, built against the duckdb target (self-contained, no Snowflake credentials
    # needed just to generate documentation HTML) and published to GitHub Pages. Only on
    # merge to main — a PR's docs aren't the canonical published set.
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Seed + build (duckdb — self-contained, just to populate docs' catalog metadata)
        run: |
          dbt seed --project-dir dbt --profiles-dir dbt --target duckdb
          dbt build --project-dir dbt --profiles-dir dbt --target duckdb

      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target duckdb

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

      - uses: actions/deploy-pages@v4
        id: deployment

  build-and-push:
    # Only after tests pass, and only when landing on main.
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

  deploy:
    # Continuous delivery: push the new image to the live VPS over SSH.
    # Opt-in: stays skipped (main green) until you set repo variable
    # DEPLOY_ENABLED=true — do that after M4 is applied and the secrets are set:
    #   gh variable set DEPLOY_ENABLED --body true
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env and copy deploy files
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Optional (M6): set once the Uptime Kuma push monitor exists (it's
          # created by hand in Kuma's UI, which has no config API). Until then
          # this is empty and run-pipeline.sh silently skips the heartbeat.
          UPTIME_KUMA_PUSH_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
        run: |
          umask 077
          {
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest"
            echo "FRED_API_KEY=${FRED_API_KEY}"
            echo "FRED_SERIES_ID=DGS10"
            echo "POSTGRES_DB=bridge"
            echo "POSTGRES_USER=bridge"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "UPTIME_KUMA_PUSH_URL=${UPTIME_KUMA_PUSH_URL}"
          } > prod.env
          scp -i ~/.ssh/id_deploy \
            deploy/docker-compose.prod.yml deploy/remote-deploy.sh deploy/bridge-pipeline.cron \
            deploy/run-pipeline.sh deploy/backup.sh prod.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Run remote deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash /tmp/remote-deploy.sh"
