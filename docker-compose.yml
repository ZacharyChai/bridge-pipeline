# M2: app + warehouse, reproducible from a clean clone.
#
# The pipeline talks to Postgres over the compose network (host "db"), so it
# needs no host port-forward — which is exactly why this works cleanly on a
# machine where Colima's forwarding is broken.
#
#   docker compose up --build     # brings up Postgres, waits for health, runs the pipeline
#
# Only FRED_API_KEY (and optionally FRED_SERIES_ID) is read from your .env.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # convenience for local psql; the app does not rely on it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FRED_API_KEY: ${FRED_API_KEY:?set FRED_API_KEY in .env}
      FRED_SERIES_ID: ${FRED_SERIES_ID:-DGS10}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: change_me

volumes:
  pgdata:
