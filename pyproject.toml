[project]
name = "bridge-pipeline"
version = "0.1.0"
description = "Containerized data pipeline: FRED macro series -> Postgres warehouse."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
